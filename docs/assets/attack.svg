<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="How a quote-spoofing hook behaves differently under simulation">
  <rect width="700" height="340" rx="10" fill="#0f1419"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6675"/>
    </marker>
  </defs>
  <text x="28" y="38" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#e8ecf1" text-anchor="start">A hook can answer two different questions</text>
  <text x="28" y="60" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">Both paths run the same contract. Only one of them moves money.</text>
  <rect x="28" y="84" width="300" height="176" rx="6" fill="#171d26" stroke="#232c38"/>
  <text x="48" y="112" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8b84b" text-anchor="start">eth_call — the quote</text>
  <text x="48" y="140" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#e8ecf1" text-anchor="start">tx.gasprice == 0</text>
  <text x="48" y="162" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">no state is written</text>
  <rect x="48" y="182" width="260" height="56" rx="6" fill="#171d26" stroke="#e8b84b"/>
  <text x="68" y="208" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#e8b84b" text-anchor="start">beforeSwap  →  honest price</text>
  <text x="68" y="226" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#5a6675" text-anchor="start">the number the user is shown</text>
  <rect x="372" y="84" width="300" height="176" rx="6" fill="#171d26" stroke="#232c38"/>
  <text x="392" y="112" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e5644e" text-anchor="start">eth_sendRawTransaction</text>
  <text x="392" y="140" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#e8ecf1" text-anchor="start">tx.gasprice &gt; 0</text>
  <text x="392" y="162" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">state is written</text>
  <rect x="392" y="182" width="260" height="56" rx="6" fill="#171d26" stroke="#e5644e"/>
  <text x="412" y="208" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#e5644e" text-anchor="start">beforeSwap  →  worse price</text>
  <text x="412" y="226" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#5a6675" text-anchor="start">the number the user receives</text>
  <line x1="332" y1="172" x2="368" y2="172" stroke="#5a6675" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="162" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#e8ecf1" text-anchor="start"></text>
  <text x="28" y="292" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">The hook reads an environment value that differs between the two, and prices</text>
  <text x="28" y="312" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">accordingly. Nothing in the quote can reveal this: the quote is the honest path.</text>
</svg>
