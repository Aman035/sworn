  <line x1="28" y1="248" x2="672" y2="248" stroke="#232c38"/>
  <text x="28" y="274" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#5a6675" text-anchor="start">total</text>
  <text x="562" y="274" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8ecf1" text-anchor="end">15,728,207</text>
