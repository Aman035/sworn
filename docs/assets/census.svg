<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Pools indexed per chain, and the hooked share">
  <rect width="700" height="300" rx="10" fill="#0f1419"/>
  <text x="28" y="40" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#e8ecf1" text-anchor="start">The population this is measured against</text>
  <text x="28" y="62" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#5a6675" text-anchor="start">Pools indexed from PoolManager Initialize logs, per chain.</text>
  <text x="28" y="116" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8ecf1" text-anchor="start">base</text>
