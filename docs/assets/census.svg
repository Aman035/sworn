  <text x="562" y="185" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8ecf1" text-anchor="end">143,218</text>
  <text x="672" y="185" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8b84b" text-anchor="end">24.1% hooked</text>
  <text x="28" y="218" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8ecf1" text-anchor="start">arbitrum</text>
  <rect x="130" y="206" width="3.0" height="16" rx="3" fill="#171d26" stroke="#232c38"/>
