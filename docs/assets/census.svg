  <text x="562" y="151" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8ecf1" text-anchor="end">256,187</text>
  <text x="672" y="151" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8b84b" text-anchor="end">17.6% hooked</text>
  <text x="28" y="184" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8ecf1" text-anchor="start">mainnet</text>
  <rect x="130" y="172" width="3.9" height="16" rx="3" fill="#171d26" stroke="#232c38"/>
