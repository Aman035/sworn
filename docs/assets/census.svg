  <text x="562" y="117" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8ecf1" text-anchor="end">15,309,659</text>
  <text x="672" y="117" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#e8b84b" text-anchor="end">98.5% hooked</text>
  <text x="28" y="150" font-family="ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#e8ecf1" text-anchor="start">bnb</text>
  <rect x="130" y="138" width="7.0" height="16" rx="3" fill="#171d26" stroke="#232c38"/>
