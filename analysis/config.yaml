# Sworn analysis parameters.
# Every threshold that appears in a result file or in the README is defined here,
# never inline in a pipeline. docs/METRICS.md defines what each one means.

version: 0

chains:
  base:
    chain_id: 8453
    rpc_env: BASE_RPC_ARCHIVE
    priority: 1
  bnb:
    chain_id: 56
    rpc_env: BNB_RPC_ARCHIVE
    priority: 2
  arbitrum:
    chain_id: 42161
    rpc_env: ARB_RPC_ARCHIVE
    priority: 3
  unichain:
    chain_id: 130
    rpc_env: UNI_RPC_ARCHIVE
    priority: 4
  mainnet:
    chain_id: 1
    rpc_env: ETH_RPC_ARCHIVE
    priority: 5
  polygon:
    chain_id: 137
    rpc_env: POLYGON_RPC_ARCHIVE
    priority: 6

paths:
  snapshots: data/snapshots
  results: data/results
  schema: analysis/schemas/results.schema.json
