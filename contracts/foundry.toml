[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
# Matches Uniswap/v4-core exactly. This is not a tuning choice: at 800 runs, solc 0.8.26
# with via-IR fails to compile PoolManager at all — "Variable memPtr_1 is 1 too deep in
# the stack". The Yul optimizer only clears that stack pressure at v4-core's own setting,
# so anything that compiles v4-core has to use it too.
optimizer_runs = 44444444
bytecode_hash = "none"
ffi = false
fs_permissions = [
    { access = "read-write", path = "./" },
    # Re-quote inputs and outputs live with the rest of the data, outside contracts/.
    { access = "read-write", path = "../data" },
]
gas_reports = ["SwornRouter", "HookBook"]
verbosity = 1

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

# Fast profile: no via-IR, for tight edit/test loops. Never used for gates.
[profile.lite]
via_ir = false
optimizer = false

[profile.ci]
verbosity = 2

[profile.ci.fuzz]
runs = 2048

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
sort_imports = true

[rpc_endpoints]
base = "${BASE_RPC_ARCHIVE}"
bnb = "${BNB_RPC_ARCHIVE}"
arbitrum = "${ARB_RPC_ARCHIVE}"
unichain = "${UNI_RPC_ARCHIVE}"
mainnet = "${ETH_RPC_ARCHIVE}"
polygon = "${POLYGON_RPC_ARCHIVE}"

[etherscan]
base = { key = "${ETHERSCAN_KEY}", chain = 8453 }
bnb = { key = "${ETHERSCAN_KEY}", chain = 56 }
arbitrum = { key = "${ETHERSCAN_KEY}", chain = 42161 }
unichain = { key = "${ETHERSCAN_KEY}", chain = 130 }
mainnet = { key = "${ETHERSCAN_KEY}", chain = 1 }
polygon = { key = "${ETHERSCAN_KEY}", chain = 137 }
