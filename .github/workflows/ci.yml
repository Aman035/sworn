name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge fmt
        run: forge fmt --check
        working-directory: contracts
      - name: forge build
        run: forge build --sizes
        working-directory: contracts
      - name: forge test
        run: forge test -vvv
        working-directory: contracts
      - name: gas snapshot
        run: forge snapshot --check || forge snapshot
        working-directory: contracts

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

  python:
    name: python (analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The analysis tests read the pinned v4-core source: `test_hookflags` parses
          # `Hooks.sol` and asserts our flag table matches it, so a v4-core bump cannot
          # silently mislabel every hook in the census. Without submodules that test
          # fails with a bare FileNotFoundError.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e "analysis[dev]"
      - run: ruff check analysis
      - run: ruff format --check analysis
      - run: pytest
        working-directory: analysis

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
