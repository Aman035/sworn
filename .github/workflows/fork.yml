name: fork-tests

on:
  workflow_dispatch:
  schedule:
    # Nightly. Fork tests hit archive RPCs, so they are kept off the PR path.
    - cron: '17 3 * * *'
  pull_request:
    types: [labeled]

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  fork:
    name: fork tests (base, bnb)
    # Two gates. `FORK_TESTS_ENABLED` is set once the archive RPC secrets exist, so a repo
    # without them skips cleanly instead of showing a permanent red X for a job that was
    # never able to run. On PRs, only run when someone asks with the `run-fork-tests` label.
    if: >-
      vars.FORK_TESTS_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.label.name == 'run-fork-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # Still fails loudly if the flag is on but the secrets are missing: a fork suite that
      # silently skips is worse than one that is switched off, because `forge test` passes
      # when every test calls `vm.skip`.
      - name: check secrets are configured
        env:
          BASE_RPC_ARCHIVE: ${{ secrets.BASE_RPC_ARCHIVE }}
          BNB_RPC_ARCHIVE: ${{ secrets.BNB_RPC_ARCHIVE }}
        run: |
          if [ -z "$BASE_RPC_ARCHIVE" ] || [ -z "$BNB_RPC_ARCHIVE" ]; then
            echo "::error::FORK_TESTS_ENABLED is true but the archive RPC secrets are not set"
            exit 1
          fi
      - name: forge test (fork)
        env:
          BASE_RPC_ARCHIVE: ${{ secrets.BASE_RPC_ARCHIVE }}
          BNB_RPC_ARCHIVE: ${{ secrets.BNB_RPC_ARCHIVE }}
        run: forge test --match-path 'test/fork/*' -vvv
        working-directory: contracts
